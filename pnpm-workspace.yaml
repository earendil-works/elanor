packages:
  - apps/*
  - packages/*
  - packages/icons/plain
  - packages/icons/plain/react
  - packages/icons/boiled
  - packages/icons/boiled/react
  - packages/logos/react

allowBuilds:
  '@swc/core': false # Use pnpm-managed native binaries, not the npm fallback installer.
  esbuild: false
  sharp: true
  workerd: false

minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeStrict: true
