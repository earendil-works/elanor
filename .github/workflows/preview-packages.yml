# Publishes preview builds of @earendil-works/elanor-react and @earendil-works/elanor-icons-react to pkg.earendil.com
# on every push to main, moving their `main` ref. pkg.earendil.com only accepts uploads authenticated with the OIDC
# token of this workflow on main, for the packages listed for this repository in earendil-works/pkg (src/config.ts).
#
# The build job runs the code and has no id-token; the publish job only uploads the packed tarballs.

name: Preview packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @earendil-works/elanor-react... --workspace-concurrency=1 run build

      - name: Pack
        run: |
          set -euo pipefail
          # elanor-react installs the elanor-icons-react build of the same commit, not a released version.
          manifest=packages/react/package.json
          jq --arg url "https://pkg.earendil.com/@earendil-works/elanor-icons-react@$GITHUB_SHA" \
            '.dependencies["@earendil-works/elanor-icons-react"] = $url' "$manifest" > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" "$manifest"
          mkdir -p "$RUNNER_TEMP/packages"
          for dir in packages/icons/plain/react packages/react; do
            (cd "$dir" && pnpm pack --config.ignore-scripts=true --pack-destination "$RUNNER_TEMP/packages")
          done

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # authenticate to pkg.earendil.com
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: Publish to pkg.earendil.com
        env:
          DIR: ${{ runner.temp }}/packages
          BASE_URL: https://pkg.earendil.com
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BASE_URL" | jq -r .value)
          echo "::add-mask::$token"
          packages=()
          for file in "$DIR"/*.tgz; do
            package=$(tar -xOzf "$file" package/package.json | jq -r .name)
            name=$(jq -rn --arg name "$package" '$name | @uri')
            curl -sS --fail-with-body -X PUT -H "Authorization: Bearer $token" --data-binary "@$file" \
              "$BASE_URL/_/upload/$GITHUB_SHA/$name?event=push"
            echo
            packages+=("$package")
          done
          jq -n --arg sha "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" '{ sha: $sha, refs: ["main"], run: $run }' |
            curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" --data-binary @- "$BASE_URL/_/refs"
          echo
          {
            echo "### Preview packages"
            echo
            echo '```sh'
            for package in "${packages[@]}"; do
              echo "npm i $BASE_URL/$package@main   # latest build of main"
              echo "npm i $BASE_URL/$package@$GITHUB_SHA"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
