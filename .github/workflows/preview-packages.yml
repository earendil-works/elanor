# pkg only accepts uploads from this workflow on main; workflow_run releases tags under that identity.
name: Preview packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA whose existing build to keep as main-<sha12>. Empty rebuilds main.
        required: false
        type: string
  workflow_run:
    workflows: [Publish npm packages]
    types: [completed]

permissions: {}

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' && inputs.sha) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify build target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-packages.mjs target

      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter './packages/**' --if-present --workspace-concurrency=1 run build

      - name: Validate packages before retention
        run: |
          pnpm check
          pnpm test

      # This job has no OIDC token; pack with the target's own package list, which may predate main's.
      - name: Pack
        env:
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/preview-packages.mjs pack "$RUNNER_TEMP/packages" "$HEAD_SHA"

      - name: Upload the packages
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packages/*.tgz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted publishing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/packages
          merge-multiple: true

      - name: Publish to pkg.earendil.com
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-packages.mjs publish "$RUNNER_TEMP/packages"

  snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # confirm the commit's main build finished uploading
      contents: read
      id-token: write
    steps:
      - name: Check out trusted publishing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Keep the build on pkg.earendil.com
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/preview-packages.mjs snapshot
