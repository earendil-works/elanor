name: Publish npm packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and main ancestry
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm
        run: npm install --global npm@11.19.1 --ignore-scripts --registry=https://registry.npmjs.org

      - name: Discover unpublished package versions
        id: release
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          node scripts/release/registry.mjs "$RUNNER_TEMP/npm-release/plan.json"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run checks
        if: steps.release.outputs.publish == 'true'
        run: pnpm check

      - name: Run tests
        if: steps.release.outputs.publish == 'true'
        run: pnpm test

      - name: Build, pack, and validate isolated consumer
        if: steps.release.outputs.publish == 'true'
        run: pnpm release:check "$RUNNER_TEMP/npm-release" "$RUNNER_TEMP/npm-release/plan.json"

      - name: Upload tested tarballs and release plan
        if: steps.release.outputs.publish == 'true'
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-release/*.tgz
            ${{ runner.temp }}/npm-release/plan.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish tested packages
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out publishing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.19.1 --ignore-scripts --registry=https://registry.npmjs.org

      - name: Download tested tarballs and release plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true

      - name: Publish tested tarballs in dependency order
        working-directory: ${{ runner.temp }}/npm-release
        run: node "$GITHUB_WORKSPACE/scripts/release/publish.mjs" plan.json "$PWD"
